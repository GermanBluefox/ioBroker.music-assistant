version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "41 2 13 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - NurPech
    versioning-strategy: increase
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: npm
    directory: "/src-admin"
    schedule:
      interval: cron
      cronjob: "41 2 13 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - NurPech
    versioning-strategy: increase
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: "/src-devices"
    schedule:
      interval: cron
      cronjob: "41 2 13 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - NurPech
    versioning-strategy: increase
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: "/src-webcomponents"
    schedule:
      interval: cron
      cronjob: "41 2 13 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - NurPech
    versioning-strategy: increase
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: "/src-widgets"
    schedule:
      interval: cron
      cronjob: "41 2 13 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - NurPech
    versioning-strategy: increase
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "41 2 13 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - NurPech
